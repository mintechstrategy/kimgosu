<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>김고수 · 로그인 준비</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#fff;
         font-family: Pretendard, -apple-system, system-ui, sans-serif; color:#1C242F; }
  main { width:min(360px, 88vw); text-align:center; padding:24px; }
  h1 { font-size:17px; font-weight:600; margin:0 0 8px; }
  p { font-size:14px; color:#5F6B7A; margin:0; line-height:1.6; }
  a.button { display:inline-block; margin-top:20px; padding:13px 22px; border-radius:10px;
             background:#283341; color:#fff; text-decoration:none; font-size:15px; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1 id="title">로그인 준비 중…</h1>
  <p id="detail">잠시만 기다려 주세요.</p>
  <a id="retry" class="button" href="#" hidden>다시 시도</a>
</main>
<script>
// 브라우저에서 소셜 로그인을 시작하는 얇은 진입점. 서버가 만든 인증 주소로 넘겨주기만
// 하고, 토큰이나 자격증명은 이 페이지에 남기지 않는다.
(function () {
  var API = 'https://api-dev-kimgosu.mintech.ai';
  var params = new URLSearchParams(location.search);
  var provider = params.get('provider') || 'google';
  var title = document.getElementById('title');
  var detail = document.getElementById('detail');
  var retry = document.getElementById('retry');

  function stop(message) {
    title.textContent = '로그인을 시작하지 못했습니다';
    detail.textContent = message;
    retry.hidden = false;
    retry.href = location.href;
  }

  fetch(API + '/v1/auth/oauth/' + encodeURIComponent(provider) + '/start', {
    method: 'POST',
    headers: { 'content-type': 'application/json', Accept: 'application/json' },
    credentials: 'omit', cache: 'no-store', body: '{}'
  })
    .then(function (response) {
      return response.json().then(function (body) { return { ok: response.ok, status: response.status, body: body }; });
    })
    .then(function (result) {
      var url = result.body && result.body.authorizationUrl;
      if (!result.ok || typeof url !== 'string') {
        var code = result.body && result.body.error && result.body.error.code;
        stop(code === 'PROVIDER_NOT_CONFIGURED'
          ? provider + ' 로그인이 아직 연결되지 않았습니다.'
          : '서버가 로그인 주소를 주지 않았습니다. (' + (code || result.status) + ')');
        return;
      }
      location.replace(url);
    })
    .catch(function () {
      stop('네트워크에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.');
    });
})();
</script>
</body>
</html>
