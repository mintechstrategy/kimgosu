name: Production checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prod-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - name: Membership backend typecheck and unit tests
        run: npm ci --ignore-scripts && npm run check && npm test
        working-directory: services/backend
      # Must run after the backend install: the web unit tests resolve ajv
      # through ../../services/backend/package.json.
      - name: Membership web typecheck, unit tests and build
        run: npm ci --ignore-scripts && npm run typecheck && npm run test:unit && npm run build
        working-directory: apps/web
