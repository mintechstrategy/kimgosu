name: Development checks
on:
  push:
    branches: [dev]
    paths: ['services/samples/railway-db/**', 'apps/dev-console/**', 'apps/diagnostics/**', 'apps/android/**', 'apps/ios/**', 'apps/mobile-shared/**', 'services/backend/**', 'apps/web/**', 'contracts/**', 'tests/contract/**', 'tests/policy/**', '.github/workflows/development.yml']
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: kg_release_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - run: npm ci --ignore-scripts && npm run check && npm test
        working-directory: services/samples/railway-db
      - run: npm ci --ignore-scripts && npm run build
        working-directory: apps/dev-console
      - name: Membership backend typecheck and unit tests
        run: npm ci --ignore-scripts && npm run check && npm test
        working-directory: services/backend
      # Must run after the backend install: the web unit tests resolve ajv
      # through ../../services/backend/package.json.
      - name: Membership web typecheck, unit tests and build
        run: npm ci --ignore-scripts && npm run typecheck && npm run test:unit && npm run build
        working-directory: apps/web
      - name: Membership v0.2 contract regression
        run: node --test tests/contract/contract.test.ts
      - name: Membership v0.3 oauth contract regression
        run: node --test tests/contract/oauth.test.ts
      - name: Membership v0.3 metadata regression (unchanged original assertions)
        run: node --test tests/policy/metadata.test.ts
      - name: Membership real PostgreSQL schema001-004 compatibility
        run: node services/backend/tests/schema-compatibility.mjs
        env:
          KG_SCHEMA_TEST_DATABASE: kg_release_ci
          KG_SCHEMA_TEST_HOST: 127.0.0.1
          KG_SCHEMA_TEST_PORT: 5432
          KG_SCHEMA_TEST_USER: postgres
      # The schema step above applies 001-004; the integration suite needs the
      # tester-account, ledger/permission and index migrations too.
      - name: Apply migrations 005 onward to the integration database
        run: |
          export PGPASSWORD=postgres
          for f in services/backend/migrations/00[5-9]_*.sql services/backend/migrations/01*_*.sql; do
            echo "applying $(basename "$f")"
            psql -h 127.0.0.1 -U postgres -d kg_release_ci -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Membership real PostgreSQL integration suite
        run: npm run test:integration
        working-directory: services/backend
        env:
          KG_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/kg_release_ci

  android:
    # A broken app build used to reach dev because CI only checked the backend and
    # the web. This job compiles the dev flavour so the failure shows up on the PR.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu runners ship the Android SDK; no extra setup action is needed and
      # pinning an unnecessary third-party one only adds a failure mode.
      - name: Assemble the dev flavour
        run: ./gradlew :app:assembleDevDebug --no-daemon
        working-directory: apps/android

  ios:
    # The simulator build needs no signing, so it runs on any macOS runner.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build for the simulator
        run: |
          xcodebuild -project Kimgosu.xcodeproj -scheme Kimgosu -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/ios

  ios-ui:
    # The expert-home UI tests drive the real dev API, so they are reported but
    # never block a merge: a dev outage must not read as a code regression.
    # Signing stays on. Turning it off removes the keychain entitlement, and a
    # session that cannot be stored looks exactly like a broken login.
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pick a simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print([v for k,v in d.items() if "iOS" in k][0][0]["name"])')
          xcrun simctl boot "$name" 2>/dev/null || true
          echo "name=$name" >> "$GITHUB_OUTPUT"
        working-directory: apps/ios
      - name: Expert home UI tests against dev
        run: |
          xcodebuild test -project Kimgosu.xcodeproj -scheme Kimgosu \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:KimgosuUITests/WS41ExpertHomeTests
        working-directory: apps/ios
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-expert-home
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 7
