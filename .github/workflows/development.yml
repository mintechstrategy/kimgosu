name: Development checks
on:
  push:
    branches: [dev]
    paths: ['services/samples/railway-db/**', 'apps/dev-console/**', 'apps/diagnostics/**', 'services/backend/**', 'contracts/auth-membership.*', 'engineering/auth-integration-02/contract.test.ts', 'engineering/backend-policy-metadata-01/metadata.test.ts', 'engineering/backend-policy-metadata-01/baseline/services/backend/src/auth.ts', '.github/workflows/development.yml']
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: kg_release_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - run: npm ci --ignore-scripts && npm run check && npm test
        working-directory: services/samples/railway-db
      - run: npm ci --ignore-scripts && npm run build
        working-directory: apps/dev-console
      - name: Membership backend typecheck and unit tests
        run: npm ci --ignore-scripts && npm run check && npm test
        working-directory: services/backend
      - name: Membership v0.2 contract regression
        run: node --test engineering/auth-integration-02/contract.test.ts
      - name: Membership v0.3 metadata regression (unchanged original assertions)
        run: node --test engineering/backend-policy-metadata-01/metadata.test.ts
      - name: Membership real PostgreSQL schema001-004 compatibility
        run: node services/backend/tests/schema-compatibility.mjs
        env:
          KG_SCHEMA_TEST_DATABASE: kg_release_ci
          KG_SCHEMA_TEST_HOST: 127.0.0.1
          KG_SCHEMA_TEST_PORT: 5432
          KG_SCHEMA_TEST_USER: postgres
