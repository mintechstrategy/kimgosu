name: Development checks
on:
  push:
    branches: [dev]
    paths: ['services/samples/railway-db/**', 'apps/dev-console/**', 'apps/diagnostics/**', 'services/backend/**', 'apps/web/**', 'contracts/**', 'tests/contract/**', 'tests/policy/**', '.github/workflows/development.yml']
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: kg_release_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - run: npm ci --ignore-scripts && npm run check && npm test
        working-directory: services/samples/railway-db
      - run: npm ci --ignore-scripts && npm run build
        working-directory: apps/dev-console
      - name: Membership backend typecheck and unit tests
        run: npm ci --ignore-scripts && npm run check && npm test
        working-directory: services/backend
      # Must run after the backend install: the web unit tests resolve ajv
      # through ../../services/backend/package.json.
      - name: Membership web typecheck, unit tests and build
        run: npm ci --ignore-scripts && npm run typecheck && npm run test:unit && npm run build
        working-directory: apps/web
      - name: Membership v0.2 contract regression
        run: node --test tests/contract/contract.test.ts
      - name: Membership v0.3 oauth contract regression
        run: node --test tests/contract/oauth.test.ts
      - name: Membership v0.3 metadata regression (unchanged original assertions)
        run: node --test tests/policy/metadata.test.ts
      - name: Membership real PostgreSQL schema001-004 compatibility
        run: node services/backend/tests/schema-compatibility.mjs
        env:
          KG_SCHEMA_TEST_DATABASE: kg_release_ci
          KG_SCHEMA_TEST_HOST: 127.0.0.1
          KG_SCHEMA_TEST_PORT: 5432
          KG_SCHEMA_TEST_USER: postgres
      # The schema step above applies 001-004; the integration suite needs the
      # tester-account, ledger/permission and index migrations too.
      - name: Apply migrations 005 onward to the integration database
        run: |
          export PGPASSWORD=postgres
          for f in services/backend/migrations/00[5-9]_*.sql services/backend/migrations/01*_*.sql; do
            echo "applying $(basename "$f")"
            psql -h 127.0.0.1 -U postgres -d kg_release_ci -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Membership real PostgreSQL integration suite
        run: npm run test:integration
        working-directory: services/backend
        env:
          KG_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/kg_release_ci
