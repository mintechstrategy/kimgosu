name: Release guard
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: release-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  release-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # master 로 들어오는 PR 은 dev 또는 hotfix/* 에서만 허용한다.
      - name: Require dev or hotfix/* as pull request head
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -eu
          case "$HEAD_REF" in
            dev|hotfix/*)
              echo "release-guard OK: head_ref=$HEAD_REF"
              ;;
            "")
              echo "::error::head_ref is empty; cannot verify release branch governance"
              exit 1
              ;;
            *)
              echo "::error::master PR must come from 'dev' or 'hotfix/*' (got '$HEAD_REF')"
              exit 1
              ;;
          esac
