name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: kimgosu-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python -m compileall -q app migrations tests
      - name: Validate Compose
        env:
          BACKEND_IMAGE: ghcr.io/mintechstrategy/kimgosu-backend:validation-only
          STORAGE_ROOT: /tmp/kimgosu-data
        run: |
          mkdir -p secrets
          openssl rand -hex 32 > secrets/db_password.txt
          openssl rand -hex 32 > secrets/jwt_secret.txt
          openssl rand -hex 32 > secrets/ci_lookup_key.txt
          docker compose config --quiet
      - name: Build and exercise chat API
        env:
          BACKEND_IMAGE: kimgosu-backend:ci
          STORAGE_ROOT: /tmp/kimgosu-data
          CHAT_TEST_BASE: http://127.0.0.1:18081/api/v1/chat
          CHAT_TEST_HTTP_PORT: "18081"
          CHAT_TEST_JWT_SECRET_FILE: secrets/jwt_secret.txt
          TEST_LOGIN_ENABLED: "true"
          LAN_BIND_IP: 127.0.0.1
          LAN_TEST_PORT: "18081"
          MARKET_TEST_BASE: http://127.0.0.1:18081/api/v1
          AUTH_TEST_BASE: http://127.0.0.1:18081/api/v1
          SUPPORT_TEST_BASE: http://127.0.0.1:18081/api/v1
          NOTIFICATION_TEST_BASE: http://127.0.0.1:18081/api/v1
          CATALOG_TEST_BASE: http://127.0.0.1:18081
        run: |
          mkdir -p /tmp/kimgosu-data/{postgres,redis,uploads,scheduler}
          sudo chown 10001:10001 /tmp/kimgosu-data/uploads /tmp/kimgosu-data/scheduler
          docker build -t "$BACKEND_IMAGE" .
          docker compose up -d --wait --wait-timeout 120
          python -m pip install 'websocket-client>=1,<2'
          python tests/chat_smoke.py
          python tests/chat_realtime.py
          docker compose exec -T api python tests/customer_identity.py
          python tests/account_api_smoke.py
          python tests/catalog_smoke.py
          python tests/marketplace_smoke.py
          python tests/authorization_matrix.py
          python tests/support_smoke.py
          python tests/notifications_smoke.py
      - name: Show service logs after test failure
        if: failure()
        env:
          BACKEND_IMAGE: kimgosu-backend:ci
          STORAGE_ROOT: /tmp/kimgosu-data
        run: docker compose logs --tail=100 api migrate db
      - name: Stop test containers
        if: always()
        env:
          BACKEND_IMAGE: kimgosu-backend:ci
          STORAGE_ROOT: /tmp/kimgosu-data
        run: docker compose down --remove-orphans

  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mintechstrategy/kimgosu-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/mintechstrategy/kimgosu
      - name: Pin published image by digest
        id: image
        run: echo "reference=ghcr.io/mintechstrategy/kimgosu-backend@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

# The local PC agent deploys the SHA-tagged image after this workflow succeeds.
