name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: kimgosu-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python -m compileall -q app migrations
      - name: Validate Compose
        env:
          BACKEND_IMAGE: ghcr.io/mintechstrategy/kimgosu-backend:validation-only
          STORAGE_ROOT: /tmp/kimgosu-data
        run: |
          mkdir -p secrets
          printf '%s' 'validation-only' > secrets/db_password.txt
          printf '%s' 'validation-only' > secrets/jwt_secret.txt
          docker compose config --quiet

  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mintechstrategy/kimgosu-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/mintechstrategy/kimgosu
      - name: Pin published image by digest
        id: image
        run: echo "reference=ghcr.io/mintechstrategy/kimgosu-backend@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

# The local PC agent deploys the SHA-tagged image after this workflow succeeds.
