map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    # Up to five 100 MB attachments plus multipart overhead.
    # The API must also enforce per-file limits and authorization.
    client_max_body_size 510m;

    # Resolve Docker service addresses again after API container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend api:8000;

    location / {
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
