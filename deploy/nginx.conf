map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# The one-time WebSocket ticket is carried in the query string. Do not log it.
map $uri $log_request {
    default 1;
    ~^/api/v1/chat/ws/ 0;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log combined if=$log_request;

    # Up to five 100 MB attachments plus multipart overhead.
    # The API must also enforce per-file limits and authorization.
    client_max_body_size 510m;

    # Resolve Docker service addresses again after API container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend api:8000;

    # Until TLS is available, never accept bearer-token API traffic over HTTP.
    # The Android debug build uses the separate LAN-only 23913 endpoint.
    location ^~ /api/v1/ { return 404; }

    location / {
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
