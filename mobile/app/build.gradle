plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mintechstrategy.kimgosu'
    compileSdk 37

    defaultConfig {
        applicationId 'com.mintechstrategy.kimgosu'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '0.5.0-test'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE_URL',
                    "\"${project.findProperty('debugApiBase') ?: 'http://192.168.0.213:23913'}\""
        }
        release {
            buildConfigField 'String', 'API_BASE_URL',
                    "\"${project.findProperty('releaseApiBase') ?: 'https://mt0205.synology.me:23912'}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
